name: Military Arsenal v1.1.1 Security Cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-cleanup-v1.1.1.yml

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove backdoor residue and publish clean v1.1.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Apply and verify source cleanup
        run: python .github/scripts/security_cleanup_v1_1_1.py

      - name: Build cleaned Military Arsenal
        run: mvn -B -e -Dmaven.test.skip=true clean package --file pom.xml

      - name: Stage and audit v1.1.1 JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*')
          test "${#jars[@]}" -eq 1
          JAR='dist/SF_MilitaryArsenal_Legacy_v1.1.1.jar'
          cp "${jars[0]}" "$JAR"
          test -s "$JAR"
          jar tf "$JAR" | grep -Fq 'plugin.yml'
          unzip -p "$JAR" plugin.yml | grep -Fq "version: '1.1.1'"
          unexpected="$(jar tf "$JAR" | grep '\.class$' | grep -v '^com/Chagui68/weaponsaddon/' || true)"
          test -z "$unexpected"
          rm -rf /tmp/ma-jar-audit
          mkdir -p /tmp/ma-jar-audit
          unzip -q "$JAR" -d /tmp/ma-jar-audit
          forbidden='dispatchCommand|getConsoleSender|setOp|PlayerCommandPreprocessEvent|PlayerKickEvent|org/bukkit/BanList|pardon|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if find /tmp/ma-jar-audit -name '*.class' -print0 | xargs -0 strings | grep -E "$forbidden"; then
            echo 'Forbidden privilege-escalation/backdoor residue found in compiled JAR.'
            exit 1
          fi
          sha256sum "$JAR"

      - name: Commit cleaned source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml src/main/java/com/Chagui68/weaponsaddon/listeners/BossAIHandler.java src/main/java/com/Chagui68/weaponsaddon/commands/WeaponsCommand.java src/main/java/com/Chagui68/weaponsaddon/handlers/MilitaryMobHandler.java
          git diff --cached --check
          git commit -m 'Military Arsenal Legacy v1.1.1 security cleanup'
          git push origin HEAD:main

      - name: Publish raw v1.1.1 security release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JAR='dist/SF_MilitaryArsenal_Legacy_v1.1.1.jar'
          NOTES='Completes removal of the hidden privilege-escalation chain: removes the remaining automatic name/IP unban code, participant tracking residue, and PULSE/SIGNAL obfuscation fragments. The cleaned source and compiled JAR were scanned for the known backdoor APIs before publication.'
          if gh release view v1.1.1 >/dev/null 2>&1; then
            gh release upload v1.1.1 "$JAR" --clobber
          else
            gh release create v1.1.1 "$JAR" --target "$(git rev-parse HEAD)" --title 'Military Arsenal Legacy v1.1.1' --notes "$NOTES"
          fi
