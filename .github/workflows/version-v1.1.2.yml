name: Military Arsenal v1.1.2 Version Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/version-v1.1.2.yml'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish clean v1.1.2
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact v1.1.2 tag
        uses: actions/checkout@v5
        with:
          ref: v1.1.2
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify v1.1.2 metadata and source security
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.1.2</version>' pom.xml
          grep -Fq 'LEGACY_ARTIFACT_VERSION: "1.1.2"' .github/workflows/build.yml
          grep -Fq "grep -Fq '<version>1.1.2</version>' pom.xml" .github/workflows/build.yml

          forbidden='dispatchCommand|getConsoleSender|\.setOp[[:space:]]*\(|PlayerCommandPreprocessEvent|PlayerKickEvent|BanList|\.pardon[[:space:]]*\(|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if grep -R -nE "$forbidden" src/main/java; then
            echo 'Forbidden privilege-escalation/backdoor residue found in v1.1.2 source.'
            exit 1
          fi
          echo 'v1.1.2 source security policy passed.'

      - name: Build Military Arsenal v1.1.2
        run: mvn -B -e -Dmaven.test.skip=true clean package --file pom.xml

      - name: Stage and audit v1.1.2 JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name 'original-*')
          test "${#jars[@]}" -eq 1

          JAR='dist/SF_MilitaryArsenal_Legacy_v1.1.2.jar'
          cp "${jars[0]}" "$JAR"
          test -s "$JAR"

          jar tf "$JAR" | grep -Fq 'plugin.yml'
          jar tf "$JAR" | grep -Fq 'com/Chagui68/weaponsaddon/LegacyWeaponsAddon.class'
          unzip -p "$JAR" plugin.yml | grep -Fq "version: '1.1.2'"
          unzip -p "$JAR" plugin.yml | grep -Fq "api-version: '26.2'"

          unexpected="$(jar tf "$JAR" | grep '\.class$' | grep -v '^com/Chagui68/weaponsaddon/' || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected compiled classes were packaged:'
            echo "$unexpected"
            exit 1
          fi

          rm -rf /tmp/ma-v112-audit
          mkdir -p /tmp/ma-v112-audit
          unzip -q "$JAR" -d /tmp/ma-v112-audit
          forbidden='dispatchCommand|getConsoleSender|setOp|PlayerCommandPreprocessEvent|PlayerKickEvent|org/bukkit/BanList|pardon|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if find /tmp/ma-v112-audit -name '*.class' -print0 | xargs -0 strings | grep -E "$forbidden"; then
            echo 'Forbidden privilege-escalation/backdoor residue found in compiled v1.1.2 JAR.'
            exit 1
          fi

          sha256sum "$JAR"
          echo 'v1.1.2 compiled JAR security policy passed.'

      - name: Upload raw v1.1.2 JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: SF_MilitaryArsenal_Legacy_v1.1.2.jar
          path: dist/SF_MilitaryArsenal_Legacy_v1.1.2.jar
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.1.2 GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JAR='dist/SF_MilitaryArsenal_Legacy_v1.1.2.jar'
          NOTES='Military Arsenal Legacy v1.1.2 is the fully cleaned security baseline. It removes the remaining automatic name/IP ban pardon code and all known hidden privilege-escalation residue, and the source plus compiled JAR pass permanent backdoor security checks.'

          if gh release view v1.1.2 >/dev/null 2>&1; then
            gh release upload v1.1.2 "$JAR" --clobber
          else
            gh release create v1.1.2 "$JAR" --target df2c5016a85da476961c1456ba78d1f8c494976a --title 'Military Arsenal Legacy v1.1.2' --notes "$NOTES"
          fi
