name: Military Arsenal v1.1.2 Version Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/version-v1.1.2.yml'

permissions:
  contents: write

jobs:
  version:
    name: Tag clean security baseline as v1.1.2
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify v1.1.2 metadata and clean source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<version>1.1.2</version>' pom.xml
          grep -Fq 'LEGACY_ARTIFACT_VERSION: "1.1.2"' .github/workflows/build.yml
          grep -Fq "grep -Fq '<version>1.1.2</version>' pom.xml" .github/workflows/build.yml

          forbidden='dispatchCommand|getConsoleSender|\.setOp[[:space:]]*\(|PlayerCommandPreprocessEvent|PlayerKickEvent|BanList|\.pardon[[:space:]]*\(|PermissionAttachment|PULSE_HEAD|PULSE_SALT|SIGNAL_TAIL|participantIds'
          if grep -R -nE "$forbidden" src/main/java; then
            echo 'Forbidden privilege-escalation/backdoor residue found before v1.1.2 tagging.'
            exit 1
          fi
          echo 'v1.1.2 clean baseline verified.'

      - name: Tag v1.1.2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse v1.1.2 >/dev/null 2>&1; then
            echo 'v1.1.2 already exists; refusing to retag.'
            exit 1
          fi
          git tag -a v1.1.2 -m 'Military Arsenal Legacy v1.1.2 - clean security baseline'
          git push origin v1.1.2
